<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 10 - Hero Section</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero{
            background:#0a0a0a;
            padding:100px 0;
        }

      
    </style>
</head>
<body>

<section class="hero text-center text-white">
    <div class="container">

        <p class="text-uppercase small fw-bold text-success">
            Ethiopia's #1 Tech Network
        </p>

        <h1 class="display-3 fw-bold">
            Connecting Minds Across Ethiopia
        </h1>

        <p class="lead text-secondary mb-4">
            Join thousands of developers, designers, and founders building Ethiopia's tech future together.
        </p>

        <div class="d-grid d-md-flex gap-3 justify-content-md-center mb-5">
            <button class="btn btn-success btn-lg">
                Get Started Free
            </button>

            <button class="btn btn-outline-light btn-lg">
                Watch Demo
            </button>
        </div>

        <div class="row justify-content-center">

            <div class="row text-center g-4">

                <div class="col-12 col-md-4">
                    <h3 class="fw-bold">2,400+</h3>
                    <p class="text-secondary mb-0">Members</p>
                </div>

                <div class="col-12 col-md-4">
                    <h3 class="fw-bold">120+</h3>
                    <p class="text-secondary mb-0">Companies</p>
                </div>

                <div class="col-12 col-md-4">
                    <h3 class="fw-bold">50+</h3>
                    <p class="text-secondary mb-0">Events</p>
                </div>

            </div>

    
        </div>

    </div>
</section> 

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
